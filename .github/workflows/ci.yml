name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - run: bun ci
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Packed package contract
        run: bun pm pack --cwd packages/nuxt-files-sdk --destination "$RUNNER_TEMP"

  compat-nuxt5-nightly:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - run: bun ci
      - run: bun run build
