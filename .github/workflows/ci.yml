name: CI

on:
    push:
        branches: [main]
    pull_request:
    merge_group:
    workflow_dispatch:

permissions: {}
concurrency:
    group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
    cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
    build:
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run build
            - run: bunx publint packages/nuxt-files-sdk
            - run: bunx attw --pack packages/nuxt-files-sdk --profile esm-only

    typecheck:
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run typecheck
    lint:
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run format:check
            - run: bun run lint
            - run: bun run workspace:check
    knip:
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bunx knip
            - run: bunx knip --production
    unit:
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:unit

    test-nuxt4:
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:nuxt4
    test-nuxt5-nightly:
        permissions:
            contents: read
        continue-on-error: true
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:nuxt5
    test-nitro2:
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:nitro2
    test-nitro3:
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:nitro3
    test-consumer:
        permissions:
            contents: read
        needs: build
        strategy:
            fail-fast: false
            matrix:
                include:
                    - compatibility: minimum
                      sdk: '2.3.1'
                      nuxt: '4.0.0'
                      nitro2: '2.13.0'
                    - compatibility: latest-supported
                      sdk: '^2.4.0'
                      nuxt: '^4.0.0'
                      nitro2: '^2.13.0'
        env:
            NUXT_FILES_SDK_VERSION: ${{ matrix.sdk }}
            NUXT_FILES_NUXT_VERSION: ${{ matrix.nuxt }}
            NUXT_FILES_NITRO2_VERSION: ${{ matrix.nitro2 }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:consumer
    test-size:
        permissions:
            contents: read
        needs: test-nuxt4
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:size
    benchmark:
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run benchmark

    ci-ok:
        if: always()
        needs:
            - build
            - typecheck
            - lint
            - knip
            - unit
            - test-nuxt4
            - test-nitro2
            - test-nitro3
            - test-consumer
            - test-size
            - benchmark
        runs-on: ubuntu-latest
        steps:
            - name: Require blocking jobs
              env:
                  NEEDS: ${{ toJSON(needs) }}
              run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS"
