name: CI

on:
    push:
        branches: [main]
    pull_request:
    merge_group:
    workflow_dispatch:

permissions: {}
concurrency:
    group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
    cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
    changes:
        permissions:
            contents: read
            pull-requests: read
        runs-on: ubuntu-latest
        outputs:
            src: ${{ steps.filter.outputs.src }}
            docs: ${{ steps.filter.outputs.docs }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { persist-credentials: false }
            - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
              id: filter
              with:
                  filters: |
                      src:
                        - 'packages/**'
                        - 'test/**'
                        - 'fixtures/**'
                        - 'package.json'
                        - 'bun.lock'
                        - 'tsconfig.json'
                        - '*.config.ts'
                        - '.github/workflows/ci.yml'
                      docs:
                        - 'README.md'
                        - 'content/**'

    build:
        permissions:
          contents: read
        needs: changes
        if: needs.changes.outputs.src == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run build
            - run: bunx publint packages/nuxt-files-sdk
            - run: bunx attw --pack packages/nuxt-files-sdk --profile esm-only

    typecheck:
        permissions:
          contents: read
        needs: changes
        if: needs.changes.outputs.src == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run typecheck
    lint:
        permissions:
          contents: read
        needs: changes
        if: needs.changes.outputs.src == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run format:check
            - run: bun run lint
            - run: bun run workspace:check
    knip:
        permissions:
          contents: read
        needs: changes
        if: needs.changes.outputs.src == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bunx knip
            - run: bunx knip --production
    unit:
        permissions:
          contents: read
        needs: changes
        if: needs.changes.outputs.src == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test

    test-nuxt4:
        permissions:
          contents: read
        needs: changes
        if: needs.changes.outputs.src == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:nuxt4
    test-nuxt5-nightly:
        permissions:
          contents: read
        needs: changes
        if: needs.changes.outputs.src == 'true'
        continue-on-error: true
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:nuxt5
    test-nitro2:
        permissions:
          contents: read
        needs: changes
        if: needs.changes.outputs.src == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:nitro2
    test-nitro3:
        permissions:
          contents: read
        needs: changes
        if: needs.changes.outputs.src == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:nitro3
    test-fixtures:
        permissions:
          contents: read
        needs: [test-nuxt4, test-nitro2, test-nitro3]
        runs-on: ubuntu-latest
        steps:
            - run: echo 'Fixture jobs passed'
    test-consumer:
        permissions:
          contents: read
        needs: [changes, build]
        if: needs.changes.outputs.src == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:consumer
    test-size:
        permissions:
          contents: read
        needs: [changes, test-nuxt4]
        if: needs.changes.outputs.src == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:size
    benchmark:
        permissions:
          contents: read
        needs: changes
        if: needs.changes.outputs.src == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run benchmark

    ci-ok:
        if: always()
        needs: [changes, build, typecheck, lint, knip, unit, test-fixtures, test-consumer, test-size, benchmark]
        runs-on: ubuntu-latest
        steps:
            - name: Require blocking jobs
              env:
                  RESULTS: ${{ join(needs.*.result, ',') }}
              run: '[[ $RESULTS != *failure* && $RESULTS != *cancelled* ]]'
