name: CI

on:
    push:
        branches: [ main ]
    pull_request:
    merge_group:
    workflow_dispatch:

permissions: {}
concurrency:
    group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
    cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
    build:
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run build
            - run: bun run peers:sync --check
            - name: Pack one immutable consumer archive
              run: |
                  mkdir -p "$RUNNER_TEMP/files-artifact"
                  npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/files-artifact" ./packages/nuxt-files-sdk
                  mv "$RUNNER_TEMP/files-artifact/"*.tgz "$RUNNER_TEMP/files-artifact/nuxt-files-sdk.tgz"
                  sha256sum "$RUNNER_TEMP/files-artifact/nuxt-files-sdk.tgz" | cut -d ' ' -f 1 > "$RUNNER_TEMP/files-artifact/sha256.txt"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: files-sdk-packed
                  path: ${{ runner.temp }}/files-artifact
                  if-no-files-found: error
                  retention-days: 7

    typecheck:
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run typecheck
    docs-build:
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run docs:build
    lint:
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run format:check
            - run: bun run lint
            - run: bun run workspace:check
    knip:
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run unused
    unit:
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:unit

    test-nuxt4:
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                os: [ ubuntu-latest, windows-latest ]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:nuxt4
    test-nuxt5-nightly:
        permissions:
            contents: read
        continue-on-error: true
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:nuxt5
    test-nitro2:
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:nitro2
    test-nitro3:
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:nitro3
    test-consumer:
        permissions:
            contents: read
        needs: build
        strategy:
            fail-fast: false
            matrix:
                os: [ ubuntu-latest, windows-latest ]
                package-manager: [ bun, npm, pnpm ]
                compatibility: [ minimum, latest-supported ]
                include:
                    - compatibility: minimum
                      nuxt: '4.6.0'
                      nitro2: '2.13.0'
                    - compatibility: latest-supported
                      nuxt: '^4.6.0'
                      nitro2: '^2.13.0'
        env:
            NUXT_FILES_PACKAGE_MANAGER: ${{ matrix.package-manager }}
            NUXT_FILES_NUXT_VERSION: ${{ matrix.nuxt }}
            NUXT_FILES_NITRO2_VERSION: ${{ matrix.nitro2 }}
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - if: matrix.package-manager == 'pnpm'
              run: npm install --global pnpm@10.25.0
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: files-sdk-packed
                  path: ${{ runner.temp }}/files-artifact
            - name: Verify and test the same archive
              env:
                  NUXT_FILES_TARBALL: ${{ runner.temp }}/files-artifact/nuxt-files-sdk.tgz
              run: bun scripts/verify-packed-artifact.ts && bun run test:consumer
    test-vite-server-experimental:
        permissions:
            contents: read
        continue-on-error: true
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:vite-server
    test-size:
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:size
    benchmark:
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run benchmark

    ci-ok:
        if: always()
        needs:
            - build
            - typecheck
            - docs-build
            - lint
            - knip
            - unit
            - test-nuxt4
            - test-nitro2
            - test-nitro3
            - test-consumer
            - test-size
            - benchmark
        runs-on: ubuntu-latest
        steps:
            - name: Require blocking jobs
              env:
                  NEEDS: ${{ toJSON(needs) }}
              run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS"
