name: CI

on:
    push:
        branches: [main]
    pull_request:
    merge_group:
    workflow_dispatch:

permissions: {}
concurrency:
    group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
    cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
    changes:
        permissions:
            contents: read
            pull-requests: read
        runs-on: ubuntu-latest
        outputs:
            src: ${{ steps.filter.outputs.src }}
            docs: ${{ steps.filter.outputs.docs }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { persist-credentials: false, fetch-depth: 0 }
            - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
              id: filter
              with:
                  filters: |
                      src:
                        - 'packages/**'
                        - 'test/**'
                        - 'fixtures/**'
                        - 'package.json'
                        - 'bun.lock'
                        - 'tsconfig.json'
                        - '*.config.ts'
                        - '.github/**'
                        - 'docs/**'
                        - 'README.md'
                      docs:
                        - 'README.md'
                        - 'content/**'

    build:
        permissions:
            contents: read
        needs: changes
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run build
            - run: bunx publint packages/nuxt-files-sdk
            - run: bunx attw --pack packages/nuxt-files-sdk --profile esm-only

    typecheck:
        permissions:
            contents: read
        needs: changes
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run typecheck
    lint:
        permissions:
            contents: read
        needs: changes
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run format:check
            - run: bun run lint
            - run: bun run workspace:check
    knip:
        permissions:
            contents: read
        needs: changes
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bunx knip
            - run: bunx knip --production
    unit:
        permissions:
            contents: read
        needs: changes
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:unit

    test-nuxt4:
        permissions:
            contents: read
        needs: changes
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:nuxt4
    test-nuxt5-nightly:
        permissions:
            contents: read
        needs: changes
        continue-on-error: true
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:nuxt5
    test-nitro2:
        permissions:
            contents: read
        needs: changes
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:nitro2
    test-nitro3:
        permissions:
            contents: read
        needs: changes
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:nitro3
    test-consumer:
        permissions:
            contents: read
        needs: [changes, build]
        strategy:
            fail-fast: false
            matrix:
                include:
                    - compatibility: minimum
                      sdk: '2.3.0'
                      nuxt: '4.0.0'
                      nitro2: '2.13.0'
                    - compatibility: latest-supported
                      sdk: '^2.3.0'
                      nuxt: '^4.0.0'
                      nitro2: '^2.13.0'
        env:
            NUXT_FILES_SDK_VERSION: ${{ matrix.sdk }}
            NUXT_FILES_NUXT_VERSION: ${{ matrix.nuxt }}
            NUXT_FILES_NITRO2_VERSION: ${{ matrix.nitro2 }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:consumer
    test-size:
        permissions:
            contents: read
        needs: [changes, test-nuxt4]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run test:size
    benchmark:
        permissions:
            contents: read
        needs: changes
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: bun run benchmark

    ci-ok:
        if: always()
        needs:
            - changes
            - build
            - typecheck
            - lint
            - knip
            - unit
            - test-nuxt4
            - test-nitro2
            - test-nitro3
            - test-consumer
            - test-size
            - benchmark
        runs-on: ubuntu-latest
        steps:
            - name: Require blocking jobs
              env:
                  NEEDS: ${{ toJSON(needs) }}
              run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS"
