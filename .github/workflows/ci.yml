name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { persist-credentials: false }
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with: { node-version: 24 }
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with: { bun-version: 1.4.0 }
            - run: bun ci
            - name: Source and workspace contracts
              run: bun run check
            - name: Packed package contract
              run: bun pm pack --cwd packages/nuxt-files-sdk --destination "$RUNNER_TEMP"

    compat-nitro:
        strategy:
            matrix:
                nitro: [latest, npm:nitro-nightly@latest]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { persist-credentials: false }
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with: { node-version: 24 }
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with: { bun-version: 1.4.0 }
            - run: bun ci
            - run: bun add --cwd packages/nuxt-files-sdk --dev nitropack@${{ matrix.nitro }}
            - run: bun run typecheck && bun run test && bun run build

    compat-nuxt5-nightly:
        continue-on-error: true
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { persist-credentials: false }
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with: { node-version: 24 }
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with: { bun-version: 1.4.0 }
            - run: bun ci
            - run: bun add --cwd packages/nuxt-files-sdk --dev nuxt@npm:nuxt-nightly@latest
            - run: bun run typecheck && bun run build
