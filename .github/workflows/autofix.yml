name: autofix.ci
on: { pull_request: {} }
permissions: { contents: read }
jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - run: bun ci
      - run: bun run format
      - run: bun run lint:fix
      - uses: autofix-ci/action@v1
