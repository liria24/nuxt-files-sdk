name: Release
on:
  push: { branches: [main] }
  pull_request: { types: [closed], branches: [main] }
  workflow_dispatch:
    inputs:
      npm-tag: { description: "npm dist-tag override", required: false, default: "" }
permissions: {}
jobs:
  pr:
    if: github.event_name == 'push' && !github.event.repository.fork
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    steps:
      - uses: danielroe/uppt/pr@09882a5a0a1a20a0e802613a77ad59fcb1c1611c # v0.6.9
        with:
          packages: packages/nuxt-files-sdk
          token: ${{ secrets.GITHUB_TOKEN }}
  release:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v') && !github.event.repository.fork
    runs-on: ubuntu-latest
    permissions: { actions: write, contents: write }
    steps:
      - uses: danielroe/uppt/release@09882a5a0a1a20a0e802613a77ad59fcb1c1611c # v0.6.9
        with:
          packages: packages/nuxt-files-sdk
          token: ${{ secrets.GITHUB_TOKEN }}
  pack:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs: { files: "${{ steps.pack.outputs.files }}" }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - run: bun ci --ignore-scripts
      - run: bun run build
      - id: pack
        uses: danielroe/uppt/pack@09882a5a0a1a20a0e802613a77ad59fcb1c1611c # v0.6.9
        with:
          checkout: false
          install: false
          packages: packages/nuxt-files-sdk
  publish:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') && needs.pack.outputs.files != '[]'
    needs: pack
    runs-on: ubuntu-latest
    environment: npm
    permissions: { id-token: write }
    steps:
      - uses: danielroe/uppt/publish@09882a5a0a1a20a0e802613a77ad59fcb1c1611c # v0.6.9
        with:
          files: ${{ needs.pack.outputs.files }}
          npm-tag: ${{ inputs.npm-tag }}
