name: Release
on:
    push: { branches: [main] }
    pull_request: { types: [closed], branches: [main] }
    workflow_dispatch:
        inputs:
            npm-tag: { description: 'npm dist-tag override', required: false, default: '' }
permissions: {}
jobs:
    pr:
        if: github.event_name == 'push' && !github.event.repository.fork
        runs-on: ubuntu-latest
        permissions: { contents: write, pull-requests: write }
        steps:
            - uses: danielroe/uppt/pr@09882a5a0a1a20a0e802613a77ad59fcb1c1611c # v0.6.9
              with:
                  packages: packages/nuxt-files-sdk
                  token: ${{ secrets.GITHUB_TOKEN }}
    release:
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v') && !github.event.repository.fork
        runs-on: ubuntu-latest
        permissions: { actions: write, contents: write }
        steps:
            - uses: danielroe/uppt/release@09882a5a0a1a20a0e802613a77ad59fcb1c1611c # v0.6.9
              with:
                  packages: packages/nuxt-files-sdk
                  token: ${{ secrets.GITHUB_TOKEN }}
    pack:
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions: { contents: read, actions: read }
        timeout-minutes: 30
        outputs: { files: '${{ steps.pack.outputs.files }}' }
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { persist-credentials: false }
            - name: Require successful CI for the tagged commit
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  sha=$(git rev-parse HEAD)
                  for attempt in {1..60}; do
                    run_id=$(gh run list --workflow ci.yml --commit "$sha" --event push --limit 1 --json databaseId --jq '.[0].databaseId')
                    if [[ -n "$run_id" && "$run_id" != null ]]; then break; fi
                    sleep 5
                  done
                  [[ -n "$run_id" && "$run_id" != null ]]
                  gh run watch "$run_id" --exit-status
                  gh run view "$run_id" --json jobs --jq '.jobs[] | select(.name == "ci-ok") | .conclusion' | grep -qx success
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with: { node-version: 24 }
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with: { bun-version-file: package.json }
            - run: bun ci --ignore-scripts
            - id: pack
              uses: danielroe/uppt/pack@09882a5a0a1a20a0e802613a77ad59fcb1c1611c # v0.6.9
              with:
                  checkout: false
                  install: false
                  packages: packages/nuxt-files-sdk
            - name: Verify the exact release artifact
              env:
                  PACKED_FILES: ${{ steps.pack.outputs.files }}
              run: |
                  tarball=$(jq -er 'if length == 1 then .[0] else error("Expected one release tarball") end' <<< "$PACKED_FILES")
                  NUXT_FILES_TARBALL="$RUNNER_TEMP/uppt-pack/$tarball" bun run test:consumer
    publish:
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') && needs.pack.outputs.files != '[]'
        needs: pack
        runs-on: ubuntu-latest
        environment: npm
        permissions: { id-token: write }
        steps:
            - uses: danielroe/uppt/publish@09882a5a0a1a20a0e802613a77ad59fcb1c1611c # v0.6.9
              with:
                  files: ${{ needs.pack.outputs.files }}
                  npm-tag: ${{ inputs.npm-tag }}
